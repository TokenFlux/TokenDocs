name: Deploy VitePress site to Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            VITEPRESS_BASE: /
            VITEPRESS_SITE_URL: https://docs.tokenflux.dev
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  # lastUpdated 需要完整提交历史，浅克隆会让所有页面显示同一时间
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm

            - name: Setup Pages
              uses: actions/configure-pages@v6

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm lint

            - name: Run tests
              run: pnpm test

            - name: Build site
              run: pnpm docs:build

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: docs/.vitepress/dist

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
